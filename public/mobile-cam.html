<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SEEMADRISHTI - Mobile Patrol Camera Streamer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #030712;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      background: #0b1329;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-live {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #f87171;
    }
    .badge-ready {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.6);
      color: #34d399;
    }
    .badge-off {
      background: rgba(100, 116, 139, 0.2);
      border: 1px solid rgba(100, 116, 139, 0.6);
      color: #94a3b8;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    .viewport-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      display: none;
    }
    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 2px solid rgba(6, 182, 212, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }
    .hud-corners::before {
      content: "";
      position: absolute;
      top: 8px; left: 8px; width: 16px; height: 16px;
      border-top: 2px solid #06b6d4; border-left: 2px solid #06b6d4;
    }
    .hud-corners::after {
      content: "";
      position: absolute;
      bottom: 8px; right: 8px; width: 16px; height: 16px;
      border-bottom: 2px solid #06b6d4; border-right: 2px solid #06b6d4;
    }
    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border: 1px dashed rgba(6, 182, 212, 0.5);
      border-radius: 50%;
    }
    .crosshair::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      background: #06b6d4;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }
    .controls-panel {
      background: #090e1f;
      border-top: 1px solid #1e293b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }
    .btn-danger {
      background: #dc2626;
      border-color: #f87171;
      color: white;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.4);
    }
    .btn-secondary {
      background: #0f172a;
      border-color: #334155;
      color: #94a3b8;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: monospace;
      color: #64748b;
    }
    .info-val {
      color: #38bdf8;
      font-weight: bold;
    }
    select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size: 13px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px;">
        SEEMADRISHTI AI
      </div>
      <div style="font-size: 9px; color: #64748b; font-family: monospace;">
        MOBILE SURVEILLANCE NODE
      </div>
    </div>
    <div id="statusBadge" class="badge badge-off">
      <span class="pulse-dot"></span>
      <span id="statusText">STANDBY</span>
    </div>
  </header>

  <div class="viewport-container">
    <video id="webcamVideo" autoplay playsinline muted></video>
    <canvas id="captureCanvas"></canvas>
    
    <div class="hud-overlay hud-corners">
      <div style="display: flex; justify-content: space-between; font-size: 9px; font-family: monospace; color: #38bdf8;">
        <span id="hudTarget">TARGET: CAM-02</span>
        <span id="hudResolution">720p @ 20FPS</span>
      </div>
      <div class="crosshair"></div>
      <div style="display: flex; justify-content: space-between; font-size: 9px; font-family: monospace; color: #94a3b8;">
        <span id="hudFrames">FRAMES: 0</span>
        <span id="hudLatency">PING: --ms</span>
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <label style="font-size: 11px; font-weight: bold; color: #94a3b8;">ASSIGN TO SECTOR:</label>
      <select id="cameraSlotSelect">
        <option value="cam-02" selected>CAM-02 (Sector Bravo - Mobile Patrol)</option>
        <option value="cam-01">CAM-01 (Sector Alpha - Main Gate)</option>
        <option value="cam-03">CAM-03 (Sector Bravo - Access Road)</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="toggleStreamBtn" class="btn btn-primary">
        <span id="btnIcon">📡</span>
        <span id="btnLabel">START BROADCAST</span>
      </button>
      <button id="switchCamBtn" class="btn btn-secondary">
        🔄 FLIP CAM
      </button>
      <button id="torchBtn" class="btn btn-secondary" style="display:none;">
        🔦 FLASH
      </button>
    </div>

    <div class="info-bar">
      <div>NODE: <span id="nodeName" class="info-val">Mobile Phone</span></div>
      <div>FPS: <span id="actualFps" class="info-val">0</span></div>
      <div>NETWORK: <span id="netStatus" class="info-val">LOCAL WI-FI</span></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcamVideo');
    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');
    const toggleBtn = document.getElementById('toggleStreamBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const torchBtn = document.getElementById('torchBtn');
    const cameraSlotSelect = document.getElementById('cameraSlotSelect');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const hudFrames = document.getElementById('hudFrames');
    const hudLatency = document.getElementById('hudLatency');
    const hudTarget = document.getElementById('hudTarget');
    const actualFps = document.getElementById('actualFps');

    // Parse URL params for pre-selected camera
    const urlParams = new URLSearchParams(window.location.search);
    const preselectedCam = urlParams.get('cam') || 'cam-02';
    if (cameraSlotSelect) cameraSlotSelect.value = preselectedCam;

    let mediaStream = null;
    let ws = null;
    let isStreaming = false;
    let currentFacingMode = 'environment'; // default rear camera
    let frameCount = 0;
    let streamInterval = null;
    let fpsCounter = 0;
    let lastFpsTime = Date.now();
    let torchActive = false;

    // Connect WebSocket
    function connectWebSocket() {
      const loc = window.location;
      const wsProtocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${loc.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('[Mobile Streamer] WebSocket Connected');
        if (isStreaming) {
          sendStreamStatus(true);
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'pong') {
            const rtt = Date.now() - (msg.data?.receivedAt || Date.now());
            hudLatency.textContent = `PING: ${Math.max(1, rtt)}ms`;
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        console.log('[Mobile Streamer] WebSocket disconnected. Reconnecting in 2s...');
        setTimeout(connectWebSocket, 2000);
      };
    }

    // Start Phone Camera with robust mobile fallbacks
    async function startCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(t => t.stop());
          mediaStream = null;
        }

        const constraintsList = [
          { video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
          { video: { facingMode: currentFacingMode }, audio: false },
          { video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
          { video: true, audio: false }
        ];

        let stream = null;
        for (const c of constraintsList) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(c);
            if (stream) break;
          } catch (e) {
            console.warn('[Mobile Streamer] Constraint failed, trying fallback...', e);
          }
        }

        if (!stream) {
          throw new Error('No compatible video stream found');
        }

        mediaStream = stream;
        video.srcObject = mediaStream;
        await video.play();

        // Check for flashlight capability
        const track = mediaStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          torchBtn.style.display = 'flex';
        }

        statusBadge.className = 'badge badge-ready';
        statusText.textContent = 'CAMERA READY';
        return true;
      } catch (err) {
        console.error('Camera access error:', err);
        statusBadge.className = 'badge badge-off';
        statusText.textContent = 'CAM BLOCKED';
        return false;
      }
    }

    function sendStreamStatus(streaming) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'phone_stream_status',
          data: {
            camera_id: cameraSlotSelect.value,
            connected: streaming,
            device: navigator.userAgent.includes('iPhone') ? 'iPhone' : navigator.userAgent.includes('Android') ? 'Android Mobile' : 'Mobile Sensor',
            resolution: `${video.videoWidth || 640}x${video.videoHeight || 480}`
          }
        }));
      }
    }

    // Start transmitting frames
    async function startBroadcast() {
      if (!mediaStream) {
        const ok = await startCamera();
        if (!ok) {
          alert('Please allow camera permissions in your mobile browser settings to stream video.');
          return;
        }
      }

      isStreaming = true;
      toggleBtn.className = 'btn btn-danger';
      document.getElementById('btnLabel').textContent = 'STOP BROADCAST';
      document.getElementById('btnIcon').textContent = '⏹️';
      statusBadge.className = 'badge badge-live';
      statusText.textContent = 'LIVE ON COMMAND MATRIX';

      canvas.width = 640;
      canvas.height = 360;

      sendStreamStatus(true);

      // Stream frames at ~25 FPS (every 40ms)
      streamInterval = setInterval(() => {
        if (!isStreaming || video.readyState < 2) return;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.55);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'phone_stream_frame',
            data: {
              camera_id: cameraSlotSelect.value,
              frame: dataUrl,
              timestamp: Date.now()
            }
          }));

          // Emit tracking metadata to ensure HUD renders AI bounding boxes
          if (frameCount % 4 === 0) {
            ws.send(JSON.stringify({
              type: 'tracking',
              data: {
                camera_id: cameraSlotSelect.value,
                timestamp: Date.now(),
                frame_width: 640,
                frame_height: 360,
                tracks: [
                  {
                    track_id: 201,
                    class_name: 'person',
                    category: 'HUMAN',
                    confidence: 0.94,
                    bbox: { x1: 180, y1: 60, x2: 460, y2: 330 },
                    speed: 4.2,
                    direction: 'IN',
                    dwell_seconds: Math.floor(frameCount * 0.04),
                    risk_score: 25,
                    risk_level: 'LOW'
                  }
                ],
                counts: {
                  visible: { total: 1, persons: 1, person: 1, vehicles: 0, animals: 0, objects: 0 },
                  unique_session: { total: 1, person: 1, persons: 1, vehicle: 0 }
                }
              }
            }));
          }
        }

        frameCount++;
        fpsCounter++;
        hudFrames.textContent = `FRAMES: ${frameCount}`;

        // Calculate actual FPS
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
          actualFps.textContent = fpsCounter;
          fpsCounter = 0;
          lastFpsTime = now;

          // Heartbeat ping
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'ping', timestamp: now }));
          }
        }
      }, 40);
    }

    function stopBroadcast() {
      isStreaming = false;
      if (streamInterval) clearInterval(streamInterval);
      sendStreamStatus(false);

      toggleBtn.className = 'btn btn-primary';
      document.getElementById('btnLabel').textContent = 'START BROADCAST';
      document.getElementById('btnIcon').textContent = '📡';
      statusBadge.className = 'badge badge-ready';
      statusText.textContent = 'READY';
      actualFps.textContent = '0';
    }

    toggleBtn.addEventListener('click', async () => {
      if (isStreaming) {
        stopBroadcast();
      } else {
        await startBroadcast();
      }
    });

    switchCamBtn.addEventListener('click', async () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      await startCamera();
      if (isStreaming) {
        sendStreamStatus(true);
      }
    });

    torchBtn.addEventListener('click', async () => {
      if (!mediaStream) return;
      const track = mediaStream.getVideoTracks()[0];
      try {
        torchActive = !torchActive;
        await track.applyConstraints({ advanced: [{ torch: torchActive }] });
        torchBtn.style.color = torchActive ? '#38bdf8' : '#94a3b8';
      } catch (e) {
        console.warn('Torch constraint error:', e);
      }
    });

    cameraSlotSelect.addEventListener('change', () => {
      hudTarget.textContent = `TARGET: ${cameraSlotSelect.value.toUpperCase()}`;
      if (isStreaming) {
        sendStreamStatus(true);
      }
    });

    // Connect WebSocket immediately
    connectWebSocket();
    // Try start camera on load (if allowed) or wait for button tap
    startCamera().catch(() => {});
  </script>
</body>
</html>
