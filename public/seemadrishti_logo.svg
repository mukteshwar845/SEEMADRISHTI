<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Dark Carbon Backdrop */}
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E243A" />
      <stop offset="60%" stop-color="#07121E" />
      <stop offset="100%" stop-color="#03080E" />
    </radialGradient>

    {/* Primary Cyan-Emerald Defense Gradient */}
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    {/* Saffron Tactical Accent */}
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    {/* Shield Body Gradient */}
    <linearGradient id="shieldBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0C1B2A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#040C14" stop-opacity="0.98" />
    </linearGradient>

    {/* High Precision Glow */}
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Background Rounded Slate Container */}
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="url(#cyberGradient)" stroke-width="2" stroke-opacity="0.3" />

  {/* Outer Armor Shield (Seema) */}
  <polygon points="256,44 442,108 442,268 256,460 70,268 70,108" fill="url(#shieldBody)" stroke="url(#cyberGradient)" stroke-width="8" stroke-linejoin="round" filter="url(#neonGlow)" />

  {/* Inner Chamfer Bevel */}
  <polygon points="256,76 410,132 410,260 256,420 102,260 102,132" fill="none" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.35" stroke-linejoin="round" />

  {/* Ballistic Corner Accents */}
  <path d="M 256 56 L 256 90" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" />
  <path d="M 426 114 L 396 130" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
  <path d="M 86 114 L 116 130" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" />
  <path d="M 256 446 L 256 410" stroke="url(#cyberGradient)" stroke-width="8" stroke-linecap="round" />

  {/* Radar & Sonar Concentric Rings */}
  <circle cx="256" cy="236" r="136" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="10 8" />
  <circle cx="256" cy="236" r="104" fill="none" stroke="url(#cyberGradient)" stroke-width="3.5" stroke-opacity="0.5" />
  <circle cx="256" cy="236" r="72" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.45" />

  {/* Target Crosshairs */}
  <line x1="256" y1="124" x2="256" y2="348" stroke="url(#cyberGradient)" stroke-width="3" stroke-opacity="0.5" />
  <line x1="144" y1="236" x2="368" y2="236" stroke="url(#cyberGradient)" stroke-width="3" stroke-opacity="0.5" />

  {/* The Central Cyber Eye (Drishti) */}
  {/* Upper Eyelid Arc */}
  <path d="M 136 236 C 184 164, 328 164, 376 236" fill="none" stroke="url(#cyberGradient)" stroke-width="11" stroke-linecap="round" filter="url(#neonGlow)" />
  {/* Lower Eyelid Arc */}
  <path d="M 136 236 C 184 308, 328 308, 376 236" fill="none" stroke="url(#cyberGradient)" stroke-width="11" stroke-linecap="round" filter="url(#neonGlow)" />

  {/* Lens Pupil Aperture */}
  <path d="M 168 236 C 200 188, 312 188, 344 236 C 312 284, 200 284, 168 236 Z" fill="#031E2E" fill-opacity="0.85" stroke="#38BDF8" stroke-width="3" />
  
  {/* Glowing Iris Core */}
  <circle cx="256" cy="236" r="40" fill="#041824" stroke="url(#goldGradient)" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="256" cy="236" r="20" fill="#38BDF8" />
  <circle cx="256" cy="236" r="9" fill="#FFFFFF" />

  {/* Active Radar Sweep Vector */}
  <path d="M 256 236 L 344 172" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" />
  <circle cx="344" cy="172" r="7" fill="#F59E0B" />

  {/* Neural Network Nodes */}
  <circle cx="160" cy="164" r="5" fill="#06B6D4" />
  <circle cx="352" cy="308" r="5" fill="#10B981" />
  <line x1="160" y1="164" x2="184" y2="188" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="352" y1="308" x2="328" y2="284" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.6" />
</svg>
